# Gin-Web 本地开发环境
#
# 用法:
#   docker compose up -d                 # 启动全部基础设施
#   docker compose up -d kafka           # 仅启动 Kafka（其余服务已独立运行时可这样用）
#   docker compose down                  # 停止并移除容器（保留数据卷）
#   docker compose down -v               # 停止并清除数据卷
#
# 说明:
#   - Kafka 采用 KRaft 模式（无需 Zookeeper），单节点即可用于本地开发与测试。
#   - 主机连接地址: 127.0.0.1:9092（已在 ADVERTISED_LISTENERS 中通告）。
#   - 若 3306/6379/5432 端口已被既有容器占用，请先停止它们，或仅启动 kafka 服务。

services:
  mysql:
    image: mysql:8.0
    container_name: gin-web-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "gin-web"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: gin-web-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16
    container_name: gin-web-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: "gin-web"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.1
    container_name: gin-web-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft 模式：单节点同时充当 controller 与 broker（无需 Zookeeper）
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # 主题自动创建（便于本地测试），默认 3 分区
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # 消费组再平衡无延迟，便于本地测试快速消费
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # KRaft 集群 ID（base64 UUID，首次启动用于格式化存储）
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  mysql_data:
  redis_data:
  postgres_data:
  kafka_data:
