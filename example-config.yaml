redis:
  host: 127.0.0.1
  port: 6379
  db: 2
  password:

rabbitmq:
  enable: false # 是否在主进程启用 RabbitMQ（与 kafka 二选一，同时启用优先 Kafka）；false 时消费者由 cmd/consumer 独立进程运行
  host: 127.0.0.1 #rabbitmq地址
  port: 5672 #rabbitmq端口
  username: magento #rabbitmq用户名
  password: 123456 #rabbitmq密码
  vhost: /saas-tenant
  concurrent_limit: 0 # 并发限制（未实现）

kafka:
  enable: false # 是否启用 Kafka（与 rabbitmq 二选一，同时启用时优先 Kafka）
  brokers: # Kafka broker 地址列表
    - 127.0.0.1:9092
  version: # Kafka 版本，如 "3.6.0.0"；留空则由客户端自动协商
  username: # SASL 用户名（无认证留空）
  password: # SASL 密码（无认证留空）
  group_id: gin-web-consumer # 默认消费组（可在 consumer.yaml 中按 consumer 覆盖）
  initial_offset: newest # 新消费组的起始 offset：newest(默认) / oldest

cron:
  enable: false # 是否在主进程集成定时任务；false 时仅由 cmd/cron 独立进程运行


